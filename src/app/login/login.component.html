<div class="album py-5">
    <div class="container">
        <h3>Login</h3>
        <div>
            <div class="col">
                <div class="card shadow -sm">
                    <div class="card-body">
                        <div class="section">
                            <div class="form-group">
                                <label for="username">Username</label>
                                <input type="text" min="6" name="username" class="form-control" id="username" placeholder="Enter username" [(ngModel)]="loginObj.username"/>
                            </div>
                            <div class="form-group">
                                <label for="password">Password</label>
                                <input type="password" min="5" max="10" name="password" class="form-control" id="password" [(ngModel)]="loginObj.password"/>
                            </div>
                            <br>
                            <button type="submit" class="btn btn-primary" (click)="onLogin()">Login</button>
                        </div>
                        <br>
                        <button type="submit" class="btn btn-secondary" (click)="onSignUp()">Sign Up</button>
                    </div>
                </div>
            </div>
        </div>
    </div>
</div>
